name = "simot-ai-os-gateway"
main = "src/worker.js"
compatibility_date = "2026-09-21"

[vars]
SIMOT_RUNTIME_VERSION = "0.3.0"
SIMOT_DEFAULT_STATE = "ACTIVE"
SIMOT_AI_MODEL = "@cf/zai-org/glm-4.7-flash"
SIMOT_AI_MAX_REQUESTS_PER_DAY = "200"
SIMOT_AI_MAX_INPUT_CHARS = "6000"
SIMOT_AI_MAX_OUTPUT_TOKENS = "500"

[ai]
binding = "AI"

[triggers]
crons = ["*/3 * * * *"]

[[d1_databases]]
binding = "SIMOT_DB"
database_name = "simot-ai-os"
database_id = "6bb8ae5c-df7d-4c4b-bf0d-bdd73857a480"

[[queues.producers]]
binding = "SIMOT_QUEUE"
queue = "simot-events"

[[queues.consumers]]
queue = "simot-events"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "simot-events-dlq"
