name = "simot-ai-os-gateway"
main = "src/worker.js"
compatibility_date = "2026-09-21"

[vars]
SIMOT_RUNTIME_VERSION = "0.5.0"
SIMOT_EXECUTION_STANDARD_VERSION = "2.2.0"
SIMOT_DEFAULT_STATE = "ACTIVE"
SIMOT_AI_MODEL = "@cf/zai-org/glm-4.7-flash"
SIMOT_AI_MAX_REQUESTS_PER_DAY = "200"
SIMOT_AI_MAX_INPUT_CHARS = "6000"
SIMOT_AI_MAX_OUTPUT_TOKENS = "350"
SIMOT_AI_MIN_INTERVAL_SECONDS = "5"
CLOUDFLARE_ACCOUNT_ID = "28c48936d40df4c64bffc755f6c0ee7f"
GEMINI_MODEL = "gemini-2.5-flash"
GEMINI_FREE_MODE = "1"
SIMOT_VOICE_TEST_MODE = "1"

[version_metadata]
binding = "CF_VERSION_METADATA"

[ai]
binding = "AI"

[[d1_databases]]
binding = "SIMOT_DB"
database_name = "simot-ai-os"
database_id = "6bb8ae5c-df7d-4c4b-bf0d-bdd73857a480"

[[queues.producers]]
binding = "SIMOT_QUEUE"
queue = "simot-events"

[[queues.consumers]]
queue = "simot-events"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "simot-events-dlq"

[[vpc_services]]
binding = "SIMOT_MASTER_MEMORY"
service_id = "01a11105-c59d-7721-889a-8b368ef8c57d"

[previews]
  [[previews.vpc_services]]
  binding = "SIMOT_MASTER_MEMORY"
  service_id = "01a11105-c59d-7721-889a-8b368ef8c57d"
