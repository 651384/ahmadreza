name = "simot-ai-os-gateway"
main = "src/worker.js"
compatibility_date = "2026-09-21"

[vars]
SIMOT_RUNTIME_VERSION = "0.4.1"
SIMOT_DEFAULT_STATE = "ACTIVE"
# CLOUD: the deployed Worker cron emits its own controller heartbeat, removing
# any dependency on a local/external controller process. EXTERNAL (or unset)
# preserves the previous behavior where only POST /controller/heartbeat feeds
# the watchdog.
SIMOT_CONTROLLER_MODE = "CLOUD"
SIMOT_AI_MODEL = "@cf/zai-org/glm-4.7-flash"
SIMOT_AI_MAX_REQUESTS_PER_DAY = "200"
SIMOT_AI_MAX_INPUT_CHARS = "6000"
SIMOT_AI_MAX_OUTPUT_TOKENS = "500"
CLOUDFLARE_ACCOUNT_ID = "28c48936d40df4c64bffc755f6c0ee7f"

[ai]
binding = "AI"

[triggers]
# Autonomous control-plane heartbeat + watchdog: every minute.
# Cloudflare Cron executes scheduled() in UTC and does not depend on a local PC.
crons = ["* * * * *"]

[[d1_databases]]
binding = "SIMOT_DB"
database_name = "simot-ai-os"
database_id = "6bb8ae5c-df7d-4c4b-bf0d-bdd73857a480"

[[queues.producers]]
binding = "SIMOT_QUEUE"
queue = "simot-events"

[[queues.consumers]]
queue = "simot-events"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "simot-events-dlq"
