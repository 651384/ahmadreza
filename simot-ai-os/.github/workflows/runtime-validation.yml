name: SIMOT AI OS Runtime Validation

on:
  pull_request:
    paths:
      - "simot-ai-os/**"
  push:
    branches:
      - "simot-ai-os/runtime-v2-gateway"
    paths:
      - "simot-ai-os/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simot-ai-os
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run deterministic tests
        run: npm test

      - name: Validate Wrangler configuration
        run: npx --yes wrangler@latest deploy --dry-run --outdir=.wrangler-dry-run
