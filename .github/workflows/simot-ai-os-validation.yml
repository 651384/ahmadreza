name: SIMOT AI OS Validation

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - "simot-ai-os/**"
      - ".github/workflows/simot-ai-os-validation.yml"

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simot-ai-os
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run deterministic tests
        run: npm test

      - name: Validate Wrangler configuration
        run: npx wrangler deploy --dry-run --config wrangler.toml

      - name: Deploy canonical master to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: simot-ai-os
          command: deploy
